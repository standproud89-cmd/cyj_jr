<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정이조 주니어 | Student Point Book - 학생 스티커 지급</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#1C2321; --ink-soft:#5B6360; --paper:#F6F7F9; --line:#E3E6E8;
    --gold:#C9971F; --gold-soft:#FBF2DE; --err:#C13E3E; --err-soft:#FDEDED; --ok:#1F7A6C; --ok-soft:#E6F6EC;
    --c-bigbox:#E0455A; --c-bigbox-soft:#FDECEF;
    --c-talktree:#0E93A6; --c-talktree-soft:#E7F8FA;
    --c-quiz:#219A6B; --c-quiz-soft:#E9F8F1;
    --c-hw:#D98216; --c-hw-soft:#FDF2E3;
    --c-part:#7C4FD9; --c-part-soft:#F1ECFC;
  }
  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:var(--paper); color:var(--ink); margin:0; padding:0 0 60px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,4vw,48px); flex-wrap:wrap; gap:10px;
  }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    font-weight:700; font-size:13px; color:var(--ink-soft);
    padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .back-link:hover{ background:var(--paper); color:var(--ink); }
  .page-title{ font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,32px); }
  .section{ margin-top:22px; }
  .section-title{ font-size:16px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; }

  label{ display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:var(--ink-soft); }
  select, input[type=text], input[type=number]{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .btn{ border:none; border-radius:8px; padding:9px 14px; font-weight:700; font-size:12.5px; cursor:pointer; background:#eef0f2; color:var(--ink); }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-err{ background:var(--err); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-sm{ padding:6px 10px; font-size:11.5px; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .toolbar select, .toolbar input{ width:auto; }
  .toolbar input#spbSearch{ flex:1; min-width:180px; }

  table.class-table{ width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; }
  table.class-table th, table.class-table td{ padding:9px 10px; text-align:left; font-size:12.5px; border-bottom:1px solid var(--line); }
  table.class-table th{ background:#FAFAFA; font-weight:700; color:var(--ink-soft); }
  .empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }

  .grant-form-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  @media (max-width:820px){ .grant-form-grid{ grid-template-columns:repeat(2,1fr); } }
  .grant-form-grid .full{ grid-column:1 / -1; }

  /* ---- SPB 지급 표: 카테고리별 색으로 구역 구분 ---- */
  .spb-table-scroll{ overflow-x:auto; border-radius:16px; }
  table.spb-table{ table-layout:fixed; border-collapse:separate; border-spacing:0; width:100%; min-width:820px; background:#fff; }
  .spb-table th, .spb-table td{ padding:7px 5px; font-size:12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .spb-table thead th{ font-size:11px; font-weight:800; color:#fff; text-align:center; white-space:nowrap; padding:9px 6px; }
  .spb-table thead tr:first-child th{ font-size:10px; font-weight:700; opacity:0.85; padding-bottom:2px; }

  .zone-id{ background:#EEF0F2; color:var(--ink); }
  .zone-id td{ background:#FAFBFC; }
  th.thead-th.zone-bigbox{ background:var(--c-bigbox); }
  th.thead-th.zone-talktree{ background:var(--c-talktree); }
  th.thead-th.zone-quiz{ background:var(--c-quiz); }
  th.thead-th.zone-hw{ background:var(--c-hw); }
  th.thead-th.zone-part{ background:var(--c-part); }
  th.thead-th.zone-deduct{ background:var(--err); }
  th.thead-th.zone-total{ background:var(--gold); }

  td.zone-bigbox{ background:var(--c-bigbox-soft); }
  td.zone-talktree{ background:var(--c-talktree-soft); }
  td.zone-quiz{ background:var(--c-quiz-soft); }
  td.zone-hw{ background:var(--c-hw-soft); }
  td.zone-part{ background:var(--c-part-soft); }
  td.zone-deduct{ background:var(--err-soft); }
  td.zone-total{ background:var(--gold-soft); font-weight:800; text-align:center; white-space:nowrap; }

  .spb-table tbody tr:hover td{ filter:brightness(0.97); }
  .spb-table .row-actions{ display:flex; align-items:center; gap:3px; justify-content:center; }
  .spb-num{ width:30px; padding:4px 2px; border-radius:5px; border:1px solid var(--line); text-align:center; font-size:11.5px; }
  .stu-name{ font-weight:800; font-size:12.5px; }
  .stu-eng{ font-size:10px; color:var(--ink-soft); }
  .stu-del{ margin-top:3px; }
  .stu-del .btn{ padding:3px 7px; font-size:10.5px; }

  .grant-btn-cell{ text-align:center; }
  .grant-mini-btn{ border:none; border-radius:6px; padding:5px 7px; font-weight:800; font-size:11px; cursor:pointer; color:#fff; white-space:nowrap; width:100%; }
  .grant-mini-btn.bigbox{ background:var(--c-bigbox); }
  .grant-mini-btn.talktree{ background:var(--c-talktree); }
  .grant-mini-btn.quiz{ background:var(--c-quiz); }
  .grant-mini-btn.hw{ background:var(--c-hw); }
  .grant-mini-btn.part{ background:var(--c-part); }
  .grant-mini-btn.deduct{ background:var(--err); }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:#1C2321; color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  .modal-bg{ position:fixed; inset:0; background:rgba(20,20,24,0.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; }
  .modal{ background:#fff; border-radius:18px; padding:22px 24px; max-width:640px; width:100%; max-height:80vh; overflow:auto; }
  .flex-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" href="staff-home.html">← For Staff</a>
    <span class="page-title">📘 Student Point Book — 학생 스티커 지급</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="toast" id="toast"></div>

<script>
// ------------------------------------------------------------
// 저장 (지금은 로컬 저장 — 추후 Supabase 실제 DB 연동 예정)
// ------------------------------------------------------------
const STORAGE_KEY = "spb_junior_v1";
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function now(){ return Date.now(); }

// 정이조 반 코드 체계
const CAMPUS_LIST = [
  "정이조주니어영어학원(목동)","정이조주니어(목2관)","정이조주니어(목3관)",
  "정이조주니어(강서)","정이조주니어(동작)","정이조주니어(마포)",
  "정이조주니어(가재울)","정이조주니어(김포운양)","정이조주니어(강동고덕)",
];
const LEVEL_DEFS = [
  {key:"wind",   label:"Wind",   initial:"W"},
  {key:"island", label:"Island", initial:"I"},
  {key:"nation", label:"Nation", initial:"N"},
  {key:"globe",  label:"Globe",  initial:"G"},
];
const DAY_GROUPS = [ {key:"M", label:"월수금"}, {key:"T", label:"화목"} ];
const TIME_SLOTS_BY_DAYGROUP = {
  M: [ {key:"F", label:"Front (오후 2:30-4:05)"}, {key:"M", label:"Middle (오후 4:10-5:45)"}, {key:"T", label:"Twilight (오후 5:50-7:25)"} ],
  T: [ {key:"F", label:"Front (오후 3:10-5:15)"}, {key:"T", label:"Twilight (오후 5:20-7:44)"} ],
};
const CLASS_GROUP_OPTIONS = ["A","B","C","D"];
function levelDef(key){ return LEVEL_DEFS.find(l=>l.key===key) || LEVEL_DEFS[0]; }
function buildClassCode(dayGroup, timeSlot, levelKey, levelNum, group){
  return `${dayGroup}(${timeSlot})${levelDef(levelKey).initial}${levelNum}-${group}`;
}

// 스티커 카테고리 (학생용 My Point Book과 동일한 카테고리 색)
const STICKER_CATS = {
  big_box:  {label:"빅박스 완료",   zone:"bigbox"},
  talk_tree:{label:"톡트리 완료",   zone:"talktree"},
  quiz:     {label:"북퀴즈 완료",   zone:"quiz"},
  book_hw:  {label:"교재 숙제 완료", zone:"hw"},
  participation:{label:"수업 참여도", zone:"part"},
};
function booksToQuizStickers(n){
  n = parseInt(n,10) || 0;
  if(n<=0) return 0;
  if(n===1) return 1;
  if(n<=6) return 2;
  return 3;
}

function seedData(){
  const classes = [
    {id:uid("cl"), code: buildClassCode("T","F","island",3,"A"), name:"Island3", campus: CAMPUS_LIST[0], dayGroup:"T", timeSlot:"F", level:"island", levelNum:3, group:"A"},
    {id:uid("cl"), code: buildClassCode("M","M","nation",2,"B"), name:"Nation2", campus: CAMPUS_LIST[0], dayGroup:"M", timeSlot:"M", level:"nation", levelNum:2, group:"B"},
  ];
  const students = [
    {id:uid("st"), name:"김민준", englishName:"Kim Minjun", classId:classes[0].id, stickers:42, stickerLog:[]},
    {id:uid("st"), name:"이서연", englishName:"Lee Seoyeon", classId:classes[0].id, stickers:58, stickerLog:[]},
    {id:uid("st"), name:"박도윤", englishName:"Park Doyun", classId:classes[1].id, stickers:20, stickerLog:[]},
  ];
  return { classes, students, ledger:[] };
}
function loadDB(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const p = JSON.parse(raw);
      if(!p.classes) p.classes = [];
      if(!p.students) p.students = [];
      if(!p.ledger) p.ledger = [];
      return p;
    }catch(e){ /* fall through */ }
  }
  const seeded = seedData();
  saveDB(seeded);
  return seeded;
}
function saveDB(db){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
let DB = loadDB();
function persist(){ saveDB(DB); }

function getClass(id){ return DB.classes.find(c=>c.id===id); }
function getStudent(id){ return DB.students.find(s=>s.id===id); }
function classDisplayLabel(cls){ return cls ? `${cls.code} · ${cls.name}` : "(반 미배정)"; }

function addLedger(studentId, delta, reason){
  DB.ledger.unshift({id:uid("lg"), studentId, delta, reason, ts:now()});
}
function addClass(data){
  const code = buildClassCode(data.dayGroup, data.timeSlot, data.level, data.levelNum, data.group);
  DB.classes.push({
    id: uid("cl"), code,
    name: (data.name && data.name.trim()) || levelDef(data.level).label,
    campus: data.campus, dayGroup: data.dayGroup, timeSlot: data.timeSlot,
    level: data.level, levelNum: data.levelNum, group: data.group,
  });
  persist(); render();
}
function removeClass(classId){
  DB.classes = DB.classes.filter(c=>c.id!==classId);
  DB.students.forEach(s=>{ if(s.classId===classId) s.classId = null; });
  persist(); render();
}
function addStudent(name, classId, englishName){
  if(!name || !name.trim()) return;
  DB.students.push({id:uid("st"), name:name.trim(), englishName:(englishName||'').trim(), classId: classId||null, stickers:0, stickerLog:[]});
  persist(); render();
}
function removeStudent(studentId){
  DB.students = DB.students.filter(s=>s.id!==studentId);
  persist(); render();
}
// 카테고리 스티커는 즉시 지급 (학생용 앱에서 "붙이기"로 재확인하는 별도 흐름과는 분리된, 스태프 전용 지급 로그)
function grantCategorySticker(studentId, categoryId, count){
  const st = getStudent(studentId);
  if(!st || !count || count<=0) return;
  st.stickers += count;
  if(!st.stickerLog) st.stickerLog = [];
  st.stickerLog.push({id:uid("sk"), categoryId, count, ts:now()});
  addLedger(studentId, count, `${STICKER_CATS[categoryId].label} 지급 (+${count})`);
  persist(); render();
  showToast(`${st.name}에게 ${STICKER_CATS[categoryId].label} ${count}개 지급 완료`);
}
function deductPoints(studentId, amount, reason){
  const st = getStudent(studentId);
  if(!st) return;
  st.stickers = Math.max(0, st.stickers - amount);
  addLedger(studentId, -amount, reason);
  persist(); render();
  showToast(`${st.name}에게서 ${amount}포인트 차감했어요`);
}
function resetSemester(){
  // (추후: 학기별 별도 카운터가 필요해지면 여기서 처리)
  showToast('현재는 스티커 초기화가 별도 카운터로 분리돼 있지 않아요');
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ------------------------------------------------------------
// 화면 상태
// ------------------------------------------------------------
let VIEW = {
  search: '', searchFocused:false,
  classFilter: 'all',
  sortAlpha: false,
  showClassPanel: false,
  showStudentPanel: false,
  showLedgerModal: false,
  newClassDayGroup: 'M',
};

function renderClassPanel(){
  const dayGroup = VIEW.newClassDayGroup || 'M';
  const slots = TIME_SLOTS_BY_DAYGROUP[dayGroup];
  return `
  <div class="card" style="margin-bottom:14px;">
    <div class="flex-between"><h3 style="margin:0;font-size:14px;">🏫 새 반 추가</h3><button class="btn btn-ghost btn-sm" id="closeClassPanel">닫기</button></div>
    <div class="grant-form-grid" style="margin-top:12px;">
      <div><label>요일그룹</label><select id="ncDayGroup">${DAY_GROUPS.map(d=>`<option value="${d.key}" ${dayGroup===d.key?'selected':''}>${d.label} (${d.key})</option>`).join('')}</select></div>
      <div><label>타임슬롯</label><select id="ncTimeSlot">${slots.map(s=>`<option value="${s.key}">${s.label}</option>`).join('')}</select></div>
      <div><label>캠퍼스</label><select id="ncCampus">${CAMPUS_LIST.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div><label>레벨</label><select id="ncLevel">${LEVEL_DEFS.map(l=>`<option value="${l.key}">${l.label} (${l.initial})</option>`).join('')}</select></div>
      <div><label>레벨 숫자</label><input id="ncLevelNum" type="number" min="1" value="1"></div>
      <div><label>구분</label><select id="ncGroup">${CLASS_GROUP_OPTIONS.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div>
      <div class="full"><label>반명칭 (비워두면 레벨명 사용)</label><input id="ncName" placeholder="예: Island3"></div>
      <div class="full"><button class="btn btn-gold" id="addClassBtn" style="width:100%;">반 추가</button></div>
    </div>
    ${DB.classes.length ? `
    <table class="class-table" style="margin-top:14px;">
      <thead><tr><th>반 코드</th><th>반명칭</th><th>캠퍼스</th><th>학생 수</th><th></th></tr></thead>
      <tbody>
        ${DB.classes.map(c=>`<tr>
          <td><code>${c.code}</code></td><td>${c.name}</td><td>${c.campus}</td>
          <td>${DB.students.filter(s=>s.classId===c.id).length}명</td>
          <td><button class="btn btn-err btn-sm" data-delclass="${c.id}">삭제</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : ''}
  </div>`;
}
function renderStudentPanel(){
  return `
  <div class="card" style="margin-bottom:14px;">
    <div class="flex-between"><h3 style="margin:0;font-size:14px;">🧒 새 학생 추가</h3><button class="btn btn-ghost btn-sm" id="closeStudentPanel">닫기</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <input id="nsName" placeholder="학생 이름 (한글)" style="width:auto;flex:1;min-width:140px;">
      <input id="nsEnglishName" placeholder="영어 이름 (검색용)" style="width:auto;flex:1;min-width:140px;">
      <select id="nsClass" style="width:auto;min-width:180px;">
        <option value="">반 미배정</option>
        ${DB.classes.map(c=>`<option value="${c.id}">${classDisplayLabel(c)}</option>`).join('')}
      </select>
      <button class="btn btn-gold" id="addStudentBtn">학생 추가</button>
    </div>
  </div>`;
}
function renderLedgerModal(){
  const rows = DB.ledger.slice(0,150);
  return `
  <div class="modal-bg" id="ledgerBackdrop">
    <div class="modal">
      <div class="flex-between"><h3 style="margin:0;">📊 전체 스티커 내역</h3><button class="btn btn-ghost btn-sm" id="closeLedgerModal">닫기</button></div>
      ${rows.length ? `<table class="class-table" style="margin-top:14px;">
        <thead><tr><th>학생</th><th>내용</th><th>변화</th><th>일시</th></tr></thead>
        <tbody>
          ${rows.map(l=>{
            const st = getStudent(l.studentId);
            return `<tr><td>${st?st.name:'(삭제된 학생)'}</td><td>${l.reason}</td>
              <td style="color:${l.delta>=0?'var(--ok)':'var(--err)'};font-weight:700;">${l.delta>=0?'+':''}${l.delta}</td>
              <td>${new Date(l.ts).toLocaleString('ko-KR')}</td></tr>`;
          }).join('')}
        </tbody>
      </table>` : '<div class="empty">내역이 없어요</div>'}
    </div>
  </div>`;
}

function render(){
  const search = (VIEW.search||'').trim().toLowerCase();
  const classFilter = VIEW.classFilter || 'all';
  let list = DB.students.filter(s=>{
    if(classFilter==='none' && s.classId) return false;
    if(classFilter!=='all' && classFilter!=='none' && s.classId!==classFilter) return false;
    if(search){
      const kor = (s.name||'').toLowerCase();
      const eng = (s.englishName||'').toLowerCase();
      if(!kor.includes(search) && !eng.includes(search)) return false;
    }
    return true;
  });
  if(VIEW.sortAlpha) list = list.slice().sort((a,b)=> a.name.localeCompare(b.name,'ko'));

  document.getElementById('app').innerHTML = `
    <div class="section">
      <div class="section-title">🏫 반 관리</div>
      <div class="card">
        <div class="toolbar">
          <button class="btn btn-gold" id="toggleClassPanel">${VIEW.showClassPanel?'▲ 닫기':'+ 반 추가 / 목록 보기'}</button>
          <span style="font-size:12.5px;color:var(--ink-soft);">정이조 담임 안내문 시스템과 동일한 반 코드 체계를 사용해요</span>
        </div>
        ${VIEW.showClassPanel ? renderClassPanel() : ''}
      </div>
    </div>

    <div class="section">
      <div class="section-title">🧒 학생 스티커 지급</div>
      <div class="card">
        <div class="toolbar">
          <select id="classFilterSel">
            <option value="all" ${classFilter==='all'?'selected':''}>반명 / 전체선택</option>
            ${DB.classes.map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${classDisplayLabel(c)}</option>`).join('')}
            <option value="none" ${classFilter==='none'?'selected':''}>반 미배정</option>
          </select>
          <input id="spbSearch" placeholder="학생명 검색 (한글/영문)" value="${VIEW.search||''}">
          <button class="btn" id="sortBtn">${VIEW.sortAlpha?'✓ ':''}가나다순 정렬</button>
          <button class="btn btn-gold" id="toggleStudentPanel">+ 학생 추가</button>
          <button class="btn btn-ghost" id="ledgerBtn">📊 전체 내역</button>
        </div>
        ${VIEW.showStudentPanel ? renderStudentPanel() : ''}

        <div class="spb-table-scroll">
        <table class="spb-table">
          <colgroup>
            <col style="width:110px;"><col style="width:96px;">
            <col style="width:66px;"><col style="width:66px;"><col style="width:86px;">
            <col style="width:86px;"><col style="width:86px;"><col style="width:66px;"><col style="width:64px;">
          </colgroup>
          <thead>
            <tr>
              <th class="zone-id" rowspan="2" style="color:var(--ink-soft);">반명</th>
              <th class="zone-id" rowspan="2" style="color:var(--ink-soft);">학생명</th>
              <th class="thead-th zone-bigbox">빅박스</th>
              <th class="thead-th zone-talktree">톡트리</th>
              <th class="thead-th zone-quiz">북퀴즈</th>
              <th class="thead-th zone-hw">교재숙제</th>
              <th class="thead-th zone-part">수업참여도</th>
              <th class="thead-th zone-deduct">교재복사</th>
              <th class="thead-th zone-total" rowspan="2">총 스티커</th>
            </tr>
            <tr>
              <th class="thead-th zone-bigbox">배부</th>
              <th class="thead-th zone-talktree">배부</th>
              <th class="thead-th zone-quiz">배부</th>
              <th class="thead-th zone-hw">배부</th>
              <th class="thead-th zone-part">배부</th>
              <th class="thead-th zone-deduct">포인트 차감</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(s=>`
            <tr>
              <td class="zone-id">${classDisplayLabel(getClass(s.classId))}</td>
              <td class="zone-id">
                <div class="stu-name">${s.name}</div>
                ${s.englishName?`<div class="stu-eng">${s.englishName}</div>`:''}
                <div class="stu-del"><button class="btn btn-ghost btn-sm" data-delstudent="${s.id}">삭제</button></div>
              </td>
              <td class="zone-bigbox grant-btn-cell"><button class="grant-mini-btn bigbox" data-grant="${s.id}" data-cat="big_box" data-amt="2">배부 +2</button></td>
              <td class="zone-talktree grant-btn-cell"><button class="grant-mini-btn talktree" data-grant="${s.id}" data-cat="talk_tree" data-amt="1">배부 +1</button></td>
              <td class="zone-quiz">
                <div class="row-actions">
                  <input type="number" min="0" value="1" class="spb-num" id="quizN_${s.id}">
                  <button class="grant-mini-btn quiz" data-grantquiz="${s.id}">배부</button>
                </div>
              </td>
              <td class="zone-hw">
                <div class="row-actions">
                  <input type="number" min="1" value="1" class="spb-num" id="hwN_${s.id}">
                  <button class="grant-mini-btn hw" data-grantinput="${s.id}" data-cat="book_hw" data-input="hwN_${s.id}">배부</button>
                </div>
              </td>
              <td class="zone-part">
                <div class="row-actions">
                  <input type="number" min="1" value="1" class="spb-num" id="partN_${s.id}">
                  <button class="grant-mini-btn part" data-grantinput="${s.id}" data-cat="participation" data-input="partN_${s.id}">배부</button>
                </div>
              </td>
              <td class="zone-deduct grant-btn-cell"><button class="grant-mini-btn deduct" data-deduct="${s.id}" data-amt="6">차감 -6</button></td>
              <td class="zone-total">🍬 ${s.stickers}</td>
            </tr>`).join('') || `<tr><td colspan="9" class="empty">해당하는 학생이 없어요</td></tr>`}
          </tbody>
        </table>
        </div>
      </div>
    </div>

    ${VIEW.showLedgerModal ? renderLedgerModal() : ''}
  `;
  bind();
}

function bind(){
  const toggleClassPanel = document.getElementById('toggleClassPanel');
  if(toggleClassPanel) toggleClassPanel.onclick = ()=>{ VIEW.showClassPanel = !VIEW.showClassPanel; render(); };
  const closeClassPanel = document.getElementById('closeClassPanel');
  if(closeClassPanel) closeClassPanel.onclick = ()=>{ VIEW.showClassPanel = false; render(); };

  const toggleStudentPanel = document.getElementById('toggleStudentPanel');
  if(toggleStudentPanel) toggleStudentPanel.onclick = ()=>{ VIEW.showStudentPanel = !VIEW.showStudentPanel; render(); };
  const closeStudentPanel = document.getElementById('closeStudentPanel');
  if(closeStudentPanel) closeStudentPanel.onclick = ()=>{ VIEW.showStudentPanel = false; render(); };

  const ncDayGroup = document.getElementById('ncDayGroup');
  if(ncDayGroup) ncDayGroup.onchange = ()=>{ VIEW.newClassDayGroup = ncDayGroup.value; render(); };
  const addClassBtn = document.getElementById('addClassBtn');
  if(addClassBtn) addClassBtn.onclick = ()=>{
    addClass({
      dayGroup: ncDayGroup.value,
      timeSlot: document.getElementById('ncTimeSlot').value,
      campus: document.getElementById('ncCampus').value,
      level: document.getElementById('ncLevel').value,
      levelNum: parseInt(document.getElementById('ncLevelNum').value||'1',10),
      group: document.getElementById('ncGroup').value,
      name: document.getElementById('ncName').value,
    });
  };
  document.querySelectorAll('[data-delclass]').forEach(el=>{
    el.onclick = ()=>{ if(confirm('이 반을 삭제할까요? (소속 학생은 반 미배정이 돼요)')) removeClass(el.dataset.delclass); };
  });

  const addStudentBtn = document.getElementById('addStudentBtn');
  if(addStudentBtn) addStudentBtn.onclick = ()=>{
    addStudent(document.getElementById('nsName').value, document.getElementById('nsClass').value||null, document.getElementById('nsEnglishName').value);
  };
  document.querySelectorAll('[data-delstudent]').forEach(el=>{
    el.onclick = ()=>{ if(confirm('이 학생을 삭제할까요?')) removeStudent(el.dataset.delstudent); };
  });

  const classFilterSel = document.getElementById('classFilterSel');
  if(classFilterSel) classFilterSel.onchange = ()=>{ VIEW.classFilter = classFilterSel.value; render(); };

  const searchInput = document.getElementById('spbSearch');
  if(searchInput){
    searchInput.oninput = ()=>{ VIEW.search = searchInput.value; render(); };
    searchInput.onfocus = ()=>{ VIEW.searchFocused = true; };
    searchInput.onblur = ()=>{ VIEW.searchFocused = false; };
    if(VIEW.searchFocused){
      searchInput.focus();
      const len = searchInput.value.length;
      searchInput.setSelectionRange(len,len);
    }
  }
  const sortBtn = document.getElementById('sortBtn');
  if(sortBtn) sortBtn.onclick = ()=>{ VIEW.sortAlpha = !VIEW.sortAlpha; render(); };

  const ledgerBtn = document.getElementById('ledgerBtn');
  if(ledgerBtn) ledgerBtn.onclick = ()=>{ VIEW.showLedgerModal = true; render(); };
  const closeLedgerModal = document.getElementById('closeLedgerModal');
  if(closeLedgerModal) closeLedgerModal.onclick = ()=>{ VIEW.showLedgerModal = false; render(); };
  const ledgerBackdrop = document.getElementById('ledgerBackdrop');
  if(ledgerBackdrop) ledgerBackdrop.onclick = (e)=>{ if(e.target===ledgerBackdrop){ VIEW.showLedgerModal=false; render(); } };

  document.querySelectorAll('[data-grant]').forEach(el=>{
    el.onclick = ()=> grantCategorySticker(el.dataset.grant, el.dataset.cat, parseInt(el.dataset.amt,10));
  });
  document.querySelectorAll('[data-grantquiz]').forEach(el=>{
    el.onclick = ()=>{
      const sid = el.dataset.grantquiz;
      const n = parseInt(document.getElementById('quizN_'+sid).value||'0',10);
      const count = booksToQuizStickers(n);
      if(count<=0){ showToast('권수를 입력해주세요'); return; }
      grantCategorySticker(sid, 'quiz', count);
    };
  });
  document.querySelectorAll('[data-grantinput]').forEach(el=>{
    el.onclick = ()=>{
      const sid = el.dataset.grantinput;
      const cat = el.dataset.cat;
      const n = parseInt(document.getElementById(el.dataset.input).value||'0',10);
      if(n<=0){ showToast('수량을 입력해주세요'); return; }
      grantCategorySticker(sid, cat, n);
    };
  });
  document.querySelectorAll('[data-deduct]').forEach(el=>{
    el.onclick = ()=>{
      const sid = el.dataset.deduct;
      const amt = parseInt(el.dataset.amt,10);
      if(confirm(`교재 복사 포인트 ${amt}개를 차감할까요?`)) deductPoints(sid, amt, '교재 복사 포인트 차감');
    };
  });
}

render();
</script>
</body>
</html>
