const WEEKDAY_KO = ['일','월','화','수','목','금','토'];

function groupToDisplayCode(group){
  if(group.length===2) return `${group[0]}(${group[1]})`;

function formatStartDate(iso, semesterName){

/* ============== 파싱 ============== */
function parseTSV(text){
  const lines = text.trim().split('\n').filter(l=>l.trim());
  const rows = lines.slice(1); // 헤더 제외
  return rows.map(line=>{
    const [group, code, teacher, room, name, grade, levelUp] = line.split('\t').map(s=>(s||'').trim());
    return { group, code, teacher, room, name, grade, levelUp: (levelUp==='O'||levelUp==='o') };
  }).filter(r=>r.name);
}

/* 전체 레벨 순서 (Wind1(3개월)만 예외, 나머지는 전부 6개월/2학기).
   레벨업은 숫자+1이 아니라 이 배열의 "다음 칸"으로 이동한다 (Island4 다음은 Nation1). */
const LEVEL_SEQUENCE = [
  'W1','W2',
  'I1','I2','I3','I4',
  'N1','N2','N3','N4',
  'G1','G2','G3','G4'
];
const LEVEL_INITIAL_MAP = { W:'W', I:'I', N:'N', G:'G' };

function parseCode(code){
  const m = code.match(/^([A-Za-z]+)(\d+)-([A-Za-z0-9]+)$/);
  if(!m) return { letter:code, number:0, suffix:'', seqKey:code };
  return { letter:m[1], number:parseInt(m[2],10), suffix:m[3], seqKey:`${m[1]}${m[2]}` };
}

function nextLevelSeqKey(seqKey){
  const idx = LEVEL_SEQUENCE.indexOf(seqKey);
  if(idx === -1) return seqKey; // 못 찾으면 그대로 (형식이 다른 코드일 수 있음)
  if(idx === LEVEL_SEQUENCE.length-1) return seqKey; // Globe4가 마지막 — 다음 단계 없음
  return LEVEL_SEQUENCE[idx+1];
}

/* ============== 재배정 계산 ============== */
function computeAssignment(){
  const capacity = state.capacity;
  const withTarget = state.students.map(s=>{
    const { seqKey } = parseCode(s.code);
    const targetLevel = s.levelUp ? nextLevelSeqKey(seqKey) : seqKey;
    const groupKey = `${s.group}__${targetLevel}`;
    return { ...s, targetLevel, groupKey };
  });

  // 그룹키별로 묶기
  const byGroup = {};
  withTarget.forEach(s=>{
    if(!byGroup[s.groupKey]) byGroup[s.groupKey] = [];
    byGroup[s.groupKey].push(s);
  });

  // 각 그룹을 정원 단위로 잘라 새 반 생성
  const newClasses = [];
  Object.keys(byGroup).sort().forEach(groupKey=>{
    const list = byGroup[groupKey].slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    const [group, targetLevel] = groupKey.split('__');
    const chunkCount = Math.ceil(list.length / capacity);
    for(let i=0;i<chunkCount;i++){
      const suffix = String.fromCharCode(65+i); // A,B,C...
      const chunk = list.slice(i*capacity, (i+1)*capacity);
      const newCode = `${groupToDisplayCode(group)}${targetLevel}-${suffix}`;
      const assignKey = `${groupKey}__${suffix}`;
      newClasses.push({ assignKey, newCode, group, targetLevel, suffix, students: chunk });
    }
  });

  return newClasses;
}

function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toTSV(students){
  return '그룹\t현재반코드\t담임\t강의실\t학생이름\t학년\t레벨업여부\n' +
    students.map(s=>`${s.group}\t${s.code}\t${s.teacher}\t${s.room}\t${s.name}\t${s.grade}\t${s.levelUp?'O':'X'}`).join('\n');
}

function initKakao(){
  try{
    if(window.Kakao && state.kakaoKey){
      if(Kakao.isInitialized()) Kakao.cleanup();
      Kakao.init(state.kakaoKey);
    }
  }catch(e){ console.warn('Kakao init failed', e); }
}

/* ============== 메시지 생성 (반 단위) ============== */
function buildClassMessage(cls, teacher, room){
  const timeInfo = TIME_MAP[cls.group] || { days:'(요일 미정)', time:'(시간 미정)' };
  const displayCode = `${groupToDisplayCode(cls.group)}${cls.targetLevel}-${cls.suffix}`;
  return `학부모님~\n한 학기 동안 믿고 맡겨 주셔서 감사했습니다!\n다음 학기 강의실 안내 보내드립니다~\n\n${formatStartDate(state.startDate, state.semesterName)}\n반 명칭: ${displayCode}\n수업 요일 및 시간: ${timeInfo.days} ${timeInfo.time}\n강의실: ${room ? room+'번' : '(미정)'} 강의실`;
}

function copyText(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(()=>{ btn.textContent = orig; }, 1200);
  });
}

function shareKakao(text){
  if(!window.Kakao || !Kakao.isInitialized()){
    alert('카카오 JS 키를 먼저 왼쪽 패널에 입력해주세요.');
    return;
  }
  Kakao.Share.sendDefault({
    objectType: 'text',
    text: text,
    link: { mobileWebUrl: location.href, webUrl: location.href }
  });
}

  const newClasses = computeAssignment();

      <div class="card-title">📊 요약</div>
      <table class="summary">
        <tr><th>전체 학생</th><th>레벨업 대상</th><th>레벨 유지</th><th>생성될 새 반 수</th></tr>
        <tr><td>${totalStudents}명</td><td>${levelUpCount}명</td><td>${totalStudents-levelUpCount}명</td><td>${newClasses.length}개</td></tr>
      </table>
    </div>

    <div class="card">
      <div class="card-title">🏫 새 학기 반 편성 (정원 ${state.capacity}명 기준 자동 분배)</div>
      <div class="class-grid">
        ${newClasses.map(cls=>{
          const assign = state.classAssign[cls.assignKey] || {};
          return `
          <div class="class-card">
            <div class="class-card-head">
              <div class="class-code">${cls.newCode}</div>
              <div class="class-count">${cls.students.length}명</div>
            </div>
            <div class="class-card-body">
              <div class="row2">
                <input type="text" placeholder="담임" data-assign="${cls.assignKey}" data-field="teacher" value="${assign.teacher||''}">
                <input type="text" placeholder="강의실" data-assign="${cls.assignKey}" data-field="room" value="${assign.room||''}">
              </div>
              <ul class="student-list">
                ${cls.students.map(s=>`<li>${s.name}(${s.grade}) ${s.levelUp?'<span class=\"lvup-tag\">LEVEL UP</span>':''}</li>`).join('')}
              </ul>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">💬 반별 안내문자 미리보기</div>
      <div id="msgList">
        ${newClasses.map(cls=>{
          const assign = state.classAssign[cls.assignKey] || {};
          const msg = buildClassMessage(cls, assign.teacher, assign.room);
          return `
          <div class="msg-item" data-assignkey="${cls.assignKey}">
            <div class="msg-text">${msg.replace(/\n/g,'<br>')}</div>
            <div class="msg-actions">
              <button class="copy-btn" data-copy>복사</button>
              <button class="kakao-btn" data-kakao>카톡 공유</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  stage.innerHTML = html;

  // 담임/강의실 입력 바인딩
  stage.querySelectorAll('[data-assign]').forEach(el=>{
    el.oninput = ()=>{
      const key = el.dataset.assign, field = el.dataset.field;
      if(!state.classAssign[key]) state.classAssign[key] = {};
      state.classAssign[key][field] = el.value;
      renderStage();
    };
  });

  // 메시지 버튼 바인딩 (반 단위, 재렌더 후 다시 걸어줘야 함)
  newClasses.forEach(cls=>{
    const assign = state.classAssign[cls.assignKey] || {};
    const msg = buildClassMessage(cls, assign.teacher, assign.room);
    const item = stage.querySelector(`.msg-item[data-assignkey="${cls.assignKey}"]`);
    const copyBtn = item.querySelector('[data-copy]');
    const kakaoBtn = item.querySelector('[data-kakao]');
    copyBtn.onclick = ()=> copyText(msg, copyBtn);
    kakaoBtn.onclick = ()=> shareKakao(msg);
  });
}

/* ============== 초기화 ============== */
function renderAll(){ renderPanel(); renderStage(); }
renderAll();
</script>
</body>
</html>
