<script>
// 과거형 ↔ 원형 (동사 모양 바꾸기 · 틀린 곳 고치기용)
const PAST={stole:'steal',hid:'hide',took:'take',invited:'invite',gave:'give',rolled:'roll',came:'come',struck:'strike',gazed:'gaze',
 shivered:'shiver',sat:'sit',sold:'sell',went:'go',looked:'look',filled:'fill',bought:'buy',tripped:'trip',fell:'fall',started:'start',
 walked:'walk',heard:'hear',saw:'see',muttered:'mutter',held:'hold',shouted:'shout',lived:'live',disappeared:'disappear',felt:'feel'};
// 현재형(3인칭 -s) ↔ 원형도 같이 (Miracle 교재는 현재 시제 이야기가 많음)
Object.assign(PAST,{sings:'sing',makes:'make',finds:'find',sees:'see',cries:'cry',lives:'live',catches:'catch',keeps:'keep',loves:'love',gets:'get',hears:'hear',
 thinks:'think',walks:'walk',needs:'need',breaks:'break',marries:'marry',puts:'put',tells:'tell',likes:'like',sends:'send',wants:'want',follows:'follow',kills:'kill',
 says:'say',asks:'ask',goes:'go',takes:'take',comes:'come',meets:'meet',smiles:'smile',laughs:'laugh',falls:'fall',grows:'grow',stops:'stop',flies:'fly',fly:null});
delete PAST.fly;
const STOP=new Set('the a an and but or so to of in on at by for with was were is are be been her his him she he they them their it its this that these those i you we my your our had have has did do not no as then there what who whose when why would like will can just one only'.split(' '));
function pool(D){ // 문장 재료: 핸드북 문장 + 본문 문장
  const out=[...D.sentences.map(s=>({e:s.e,k:s.k}))];const seen=new Set(out.map(s=>s.e));
  (D.passage||[]).forEach(p=>p.split(/(?<=[.!?])(?:”)?\s+(?=[“A-Z])/).forEach(x=>{x=x.trim();const n=x.split(' ').length;if(n>=5&&n<=16&&!seen.has(x)&&!/^“/.test(x)){seen.add(x);out.push({e:x})}}));
  return out;
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(1);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const take=(a,n)=>shuf(a).slice(0,n);
const NUM='①②③④⑤';const AL='abcdefghij';
const red=s=>`<b class="red">${s}</b>`;
const mcHtml=opts=>`<div class="opts">${opts.map((o,i)=>`<span>${NUM[i]} ${esc(o)}</span>`).join('')}</div>`;
const single=D=>D.vocab.filter(v=>!v.w.includes(' '));
const wre=w=>new RegExp('\\b'+w.replace(/ /g,'\\s+')+'\\b','i');
const ol=(items,cls='')=>`<ol class="ql ${cls}">${items.map(x=>`<li>${x}</li>`).join('')}</ol>`;

/* ===================== 문제 유형 ===================== */
const CATS=[
 {k:'word',t:'단어',ic:'📘'},{k:'sent',t:'문장',ic:'✏️'},{k:'blank',t:'빈칸',ic:'🔲'},{k:'read',t:'독해',ic:'📖'}];
const TYPES=[
 /* ---------- 단어 ---------- */
 {k:'v_en2ko',c:'word',t:'영어 보고 뜻 고르기',en:'Choose the correct meaning.',ko:'단어의 알맞은 뜻을 고르세요.',def:5,max:8,
  gen(D,n){const v=take(D.vocab,n);const it=v.map(x=>{const o=shuf([x.k,...take(D.vocab.filter(y=>y!==x),3).map(y=>y.k)]);return{x,o,a:o.indexOf(x.k)}});
   return{q:ol(it.map(i=>`<b>${esc(i.x.w)}</b>${mcHtml(i.o)}`)),a:ol(it.map(i=>`${esc(i.x.w)} → ${red(NUM[i.a]+' '+esc(i.x.k))}`))}}},
 {k:'v_ko2en',c:'word',t:'뜻 보고 영어 단어 고르기',en:'Choose the correct word.',ko:'뜻에 알맞은 영어 단어를 고르세요.',def:5,max:8,
  gen(D,n){const v=take(D.vocab,n);const it=v.map(x=>{const o=shuf([x.w,...take(D.vocab.filter(y=>y!==x),3).map(y=>y.w)]);return{x,o,a:o.indexOf(x.w)}});
   return{q:ol(it.map(i=>`<b>${esc(i.x.k)}</b>${mcHtml(i.o)}`)),a:ol(it.map(i=>`${esc(i.x.k)} → ${red(NUM[i.a]+' '+esc(i.x.w))}`))}}},
 {k:'v_scr',c:'word',t:'섞인 철자 바로 쓰기',en:'Unscramble the letters.',ko:'섞인 철자를 바르게 배열해 단어를 쓰세요.',def:5,max:6,
  gen(D,n){const v=take(single(D),n);const it=v.map(x=>{let s;let g=0;do{s=shuf(x.w.split(''));g++}while(s.join('')===x.w&&g<20);return{x,s}});
   return{q:ol(it.map(i=>`<span class="letters">${i.s.map(esc).join(' · ')}</span> <span class="hintk">(${esc(i.x.k)})</span><span class="wbox"></span>`),'scr'),a:ol(it.map(i=>red(esc(i.x.w))+` <span class="hintk">(${esc(i.x.k)})</span>`))}}},
 {k:'v_miss',c:'word',t:'빠진 글자 채우기',en:'Fill in the missing letters.',ko:'빠진 글자를 채워 단어를 완성하세요.',def:5,max:6,
  gen(D,n){const v=take(single(D),n);const it=v.map(x=>{const L=x.w.split('');const idx=shuf(L.map((_,i)=>i).slice(1)).slice(0,Math.max(1,Math.round(L.length*.4)));
