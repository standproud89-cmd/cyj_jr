<style>html{background:#fff}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}img{max-width:100%}[hidden]{display:none!important}.bk{display:inline-block;margin:10px 16px 0;font:600 12px 'Noto Sans KR',sans-serif;color:var(--sub);text-decoration:none}.bk:hover{color:var(--ink)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#FAF9F6;--ink:#232023;--sub:#6E6A63;--line:#E7E1D4;--accent:#2563EB;--lf:#CA8A04;--fw:#E11D48;--ns:#0D9488;--cta:#232023;--cta-fg:#FCEFD9;--warn-bg:#FFF4D6;--warn-line:#E5B93C;--bad:#C2263B;--ok:#0D9488;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1912;--surface:#242018;--surface2:#2B2619;--ink:#F3EFE7;--sub:#B4ADA0;--line:#39352A;--accent:#60A5FA;--lf:#FBBF24;--fw:#FB7185;--ns:#2DD4BF;--cta:#F3EFE7;--cta-fg:#232023;--warn-bg:#3A2F10;--warn-line:#8A6D1E;--bad:#FB7185;--ok:#2DD4BF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1912;--surface:#242018;--surface2:#2B2619;--ink:#F3EFE7;--sub:#B4ADA0;--line:#39352A;--accent:#60A5FA;--lf:#FBBF24;--fw:#FB7185;--ns:#2DD4BF;--cta:#F3EFE7;--cta-fg:#232023;--warn-bg:#3A2F10;--warn-line:#8A6D1E;--bad:#FB7185;--ok:#2DD4BF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Pretendard',-apple-system,sans-serif;padding-inline:16px;padding-block:24px;line-height:1.5}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{height:44px;width:auto}
.top h1{margin:0;font-size:21px;letter-spacing:-.01em;text-wrap:balance}
.top .sub{font-size:11px;letter-spacing:.12em;color:var(--sub);font-weight:700;text-transform:uppercase}
.steps{display:flex;gap:6px;margin-left:auto;font-size:12px;font-weight:700}
.steps span{padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.steps span.on{background:var(--cta);color:var(--cta-fg);border-color:var(--cta)}
.panel{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:18px}
.hint{color:var(--sub);font-size:13px;margin:0}
.btn{font:700 14px 'Noto Sans KR',sans-serif;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer;min-height:44px}
.btn.cta{background:var(--cta);color:var(--cta-fg);border-color:var(--cta)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;background:var(--surface2);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.drop.over{border-color:var(--accent)}
.count{font:700 13px Poppins,sans-serif;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.count.full{background:var(--warn-bg);border-color:var(--warn-line)}
.msg{font-size:13px;color:var(--bad);font-weight:700;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.card .th{position:relative;aspect-ratio:4/3;background:var(--surface2);overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.card .no{position:absolute;left:8px;top:8px;background:var(--cta);color:var(--cta-fg);font:700 12px Poppins;border-radius:99px;padding:1px 9px}
.card .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:99px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.card .f{padding:10px;display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=number],textarea{font:500 14px 'Noto Sans KR',sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input.miss{border-color:var(--bad);background:var(--warn-bg)}
label.l{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.read{display:flex;flex-direction:column;gap:14px}
.rc{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.rc header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rc header b{font-size:16px}
.chip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--sub)}
.chip.ok{color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center}
thead th{background:var(--surface2);font-size:12px}
td.d{white-space:nowrap;font-weight:700;background:var(--surface2)}
td input{padding:5px 2px;text-align:center;border-radius:6px;border-color:transparent;background:transparent;font-weight:700}
td input:focus{border-color:var(--accent);background:var(--surface)}
td.avg input{font-weight:500;color:var(--sub)}
td.chk{background:var(--warn-bg);outline:2px solid var(--warn-line);outline-offset:-2px}
.spin{width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--cta);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 13px 'Noto Sans KR';border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.tabs button.on{background:var(--cta);color:var(--cta-fg);border-color:var(--cta)}
.rep{display:flex;flex-direction:column;gap:14px}
.rep .head{text-align:center;display:flex;flex-direction:column;gap:2px}
.rep .head small{font:700 10px Poppins;letter-spacing:.2em;color:var(--sub)}
.rep .head h3{margin:0;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.stat .b{align-self:flex-start;font:700 11px Poppins;color:#fff;padding:1px 10px;border-radius:99px}
.stat .v{font:700 30px Poppins}
.stat .s{font-size:12px;color:var(--sub)}
.ch{border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px}
.ch h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.ch h4 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ch svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-left:auto;font-weight:400}
.note{font-size:12px;color:var(--sub);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--surface2)}
@media (max-width:560px){.stats{grid-template-columns:1fr}.steps{margin-left:0}}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.slot.empty{background:var(--surface2);border-style:dashed}.slot.okc{border-color:var(--ok)}.slot.part{border-color:var(--warn-line)}
.sh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.no2{font:700 12px Poppins;background:var(--cta);color:var(--cta-fg);border-radius:99px;padding:1px 9px}
.st{font-size:12px;color:var(--sub);font-weight:700}.slot.okc .st{color:var(--ok)}
.x2{margin-left:auto;font:700 12px 'Noto Sans KR';border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:8px;padding:5px 9px;cursor:pointer;min-height:32px}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:16/8;cursor:pointer;color:var(--sub);text-align:center}
.zone .plus{font-size:30px;line-height:1;color:var(--ink)}.zone small{font-size:12px}
.rcb{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.rcr{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px}.ph{flex:0 0 230px;max-width:100%;max-height:300px;overflow:hidden;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:var(--surface2)}.ph img{display:block;width:100%}.ph.big{flex:1 1 100%;max-height:none;cursor:zoom-out}td.d{text-align:center;min-width:104px;padding:2px 4px}td.d input{font:700 11px Poppins,'Noto Sans KR',sans-serif;text-align:center;padding:5px 0;width:100%;min-width:92px;letter-spacing:-.01em}td.d.chk{background:var(--warn-bg)}td input[type=number]{min-width:66px}.nt{display:block}.ng{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 0}.nc{display:flex;flex-direction:column;align-items:stretch;gap:5px;min-width:0;padding:2px 16px;text-align:center}.nc+.nc{border-left:1px solid var(--line)}.nc .nl{background:var(--c);color:#fff;font:700 11px 'Noto Sans KR',sans-serif;border:0;border-radius:99px;padding:2px 10px;box-sizing:content-box;max-width:calc(100% - 20px);min-width:0;text-align:center;align-self:center}.nc .nl:focus{outline:2px solid var(--c);outline-offset:2px}.nc .nv{font:700 16px/1.4 'Noto Sans KR',sans-serif;color:var(--ink);border:0;border-radius:6px;background:transparent;padding:2px 0;width:100%;min-width:0;height:1.4em;resize:none;overflow:hidden;letter-spacing:-.01em;text-align:center}.nc .nv:focus{outline:2px solid var(--c);outline-offset:2px}.rlogo{height:38px;width:auto;align-self:center;margin-bottom:6px}@media (max-width:560px){.ng{grid-template-columns:1fr;gap:10px}.nc+.nc{border-left:0;border-top:1px solid var(--line);padding-top:12px}}.rep{padding:10px 4px 4px}.top img{height:48px}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .top img,:root:not([data-theme=light]) .rlogo{background:#fff;border-radius:10px;padding:3px 10px}}:root[data-theme=dark] .top img,:root[data-theme=dark] .rlogo{background:#fff;border-radius:10px;padding:3px 10px}.rlogo{height:46px!important}.slot.over{outline:2px solid var(--accent);outline-offset:-2px}
</style>

async function readTable(blob){

  if(L.hl.length<5||p0<8)return {rows:[],warn:'표의 가로줄을 찾지 못했어요. 상담 시스템의 성적 표를 줄이 보이게 캡처해 주세요.'};
  let warn='';

  if(Math.abs(sc-1)>.025){im=await toGray(blob,sc);L=findLines(im);warn=Math.abs(sc-1)>.35?'캡처 크기가 많이 달라서 읽기 정확도가 떨어질 수 있어요. 노란 칸을 꼼꼼히 확인해 주세요.':''}
  const {g,W,H}=im,hl=L.hl;
  const sep=L.vl.find(x=>x>W*.3&&x<W*.5);
  if(hl.length<4||sep==null)return {rows:[],warn:'표 모양을 알아보지 못했어요. 날짜·LF·FW·NS 표가 다 보이게 캡처해 주세요.'};
  const rows=[];let prev='9999-99-99';
  for(let k=2;k<hl.length;k++){
    const top=hl[k],bot=hl[k+1]??H;if(bot-top<10)continue;
    // 글자 줄 범위(st~en)
    const ink=(y)=>{for(let x=sep+2;x<W;x++){if(L.vlSet.has(x))continue;if(g[y*W+x]<120)return true}return false};
    let st=-1;for(let y=top+2;y<bot;y++)if(ink(y)){st=y;break}
    if(st<0)continue;let en=st;while(en<H&&ink(en))en++;
    if(en-st<6)continue;
    const cols=[];for(let x=sep+2;x<W;x++){let f=false;if(!L.vlSet.has(x))for(let y=st-1;y<en+1&&y<H;y++)if(g[y*W+x]<185){f=true;break}cols.push(f)}
    const runs=[];let a=-1;for(let i=0;i<=cols.length;i++){const v=i<cols.length&&cols[i];if(v&&a<0)a=i;if(!v&&a>=0){if(i-a>1)runs.push([a+sep+2,i+sep+2]);a=-1}}
    const cells=[];let cur=[runs[0]];for(const r of runs.slice(1)){if(r[0]-cur[cur.length-1][1]>=12){cells.push([cur[0][0],cur[cur.length-1][1]]);cur=[r]}else cur.push(r)}
    if(cur[0])cells.push([cur[0][0],cur[cur.length-1][1]]);
    if(cells.length<3)continue;
    const row={d:'',cd:0,v:[null,null,null],a:[null,null,null],cv:[0,0,0],ca:[0,0,0]};
    cells.slice(-3).forEach(([x0,x1],i)=>{
      const r=decodeCell(im,st,x0,x1),m=/^(\d{2,3})\((\d{2}\.\d{2})\)$/.exec(r.txt),bad=r.conf>CONF_MAX||r.margin<MARGIN_MIN;
      if(m){const sv=+m[1],av=+m[2];if(sv<=100&&av<=100){row.v[i]=sv;row.a[i]=av}}
      row.cv[i]=+(row.v[i]==null||bad);row.ca[i]=+(row.a[i]==null||bad);

    let dx=-1;for(let x=5;x<sep;x++){if(L.vlSet.has(x))continue;let f=false;for(let y=st-1;y<en+1&&y<H;y++)if(g[y*W+x]<185){f=true;break}if(f){dx=x;break}}

    if(hl[k+1]==null){row.cv=row.cv.map(()=>1);row.ca=row.ca.map(()=>1);row.cd=1}  // 아래가 잘린 행
    rows.push(row);
  }
  if(!rows.length)warn='읽은 행이 없어요. 표가 다 보이는 캡처인지 확인해 주세요.';
  return {rows,warn};
}

  const lab=rows.map((r,i)=>{const d=new Date(r.d+'T00:00:00'),md=`${d.getMonth()+1}/${d.getDate()}`,wd=`(${WD[d.getDay()]})`;
    return rot?`<text transform="translate(${X(i)+4},${H-40}) rotate(50)" text-anchor="start" font-size="10" font-family="Poppins" fill="var(--sub)">${md}${wd}</text>`:`<text x="${X(i)}" y="${H-32}" text-anchor="middle" font-size="11" font-weight="700" font-family="Poppins" fill="var(--sub)">${md}</text><text x="${X(i)}" y="${H-18}" text-anchor="middle" font-size="10" fill="var(--sub)">${wd}</text>`}).join('');
  const dots=rows.map((r,i)=>r.v[s]==null?'':`<circle cx="${X(i)}" cy="${Y(r.v[s])}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/><text x="${X(i)}" y="${Y(r.v[s])-10}" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Poppins" fill="${color}" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${r.v[s]}</text>`).join('');
  const da=rows.map((r,i)=>r.a[s]==null?'':`<circle cx="${X(i)}" cy="${Y(r.a[s])}" r="2.8" fill="var(--accent)"/>`).join('');
  const none=rows.map((r,i)=>r.v[s]!=null?'':`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="3 4"/>`+(rot?`<text transform="translate(${X(i)+4},${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" fill="var(--sub)" stroke="var(--surface)" stroke-width="4" paint-order="stroke">성적없음</text>`:`<text x="${X(i)}" y="${(T+H-B)/2}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--sub)" stroke="var(--surface)" stroke-width="4" paint-order="stroke">성적없음</text>`)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="점수 추이">${g}${none}${line('a','stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"')}${da}${line('v',`stroke="${color}" stroke-width="3"`)}${dots}${lab}</svg>`;
}
function v3(){
  const it=RI[rep],rows=[...it.rows].sort((a,b)=>a.d<b.d?-1:1);
  const S=[['LF','Language Framework','var(--lf)'],['FW','Fiction & Writing','var(--fw)'],['NS','Non-Fiction & Speaking','var(--ns)']];
  const cm=comments[it.id]??'';
  return `<div class="panel"><div class="tabs">${RI.map((x,i)=>`<button class="${i===rep?'on':''}" data-tab="${i}">${x.name}</button>`).join('')}</div>
  <div class="rep"><div class="head"><img class="rlogo" src="${LOGO}" alt="CYJ Jr."><small>MONTHLY REPORT</small><h3>월간 성적 리포트</h3></div>
  <div class="stats">${S.map(([k],s)=>{const vv=rows.map(r=>r.v[s]).filter(x=>x!=null),aa=rows.map(r=>r.a[s]).filter(x=>x!=null),nn=rows.length-vv.length;const m=vv.length?mean(vv):null,c=aa.length?mean(aa):null,df=m!=null&&c!=null?m-c:null;return `<div class="stat"><span class="b" style="background:${['var(--lf)','var(--fw)','var(--ns)'][s]}">${k}</span><span class="v" ${m==null?'style="font-size:18px;color:var(--sub)"':''}>${m==null?'성적없음':m.toFixed(1)}</span><span class="s">반 평균 <b style="color:var(--accent)">${c==null?'-':c.toFixed(1)}</b>${df==null?'':` · 반평균 대비 <b style="color:${df>=0?'var(--ok)':'var(--bad)'}">${df>=0?'+':''}${df.toFixed(1)}</b>`}${nn?` · <span style="color:var(--sub)">성적없음 ${nn}회</span>`:''}</span></div>`}).join('')}</div>
  ${S.map(([k,n,c],s)=>`<div class="ch"><h4><i style="background:${c}"></i>${n} <span style="color:var(--sub);font-weight:400">(${k})</span><span class="lg"><span style="color:${c}">━ ${it.name}</span><span style="color:var(--accent)">╍ 반 평균</span></span></h4>${chart(rows,s,c)}</div>`).join('')}
  <div class="nt"><div class="ng">${NOTICES.map((n,i)=>`<div class="nc" style="--c:var(--${['lf','fw','ns'][i]})"><input type="text" class="nl" style="width:${nlW(n.l)}em" data-nt="${i}:l" value="${n.l}" aria-label="${i+1}번 항목 이름"><textarea class="nv" rows="1" data-nt="${i}:v" aria-label="${i+1}번 항목 내용">${n.v}</textarea></div>`).join('')}</div></div></div>
  <div class="row"><button class="btn" data-act="edit">← 값 다시 확인</button><button class="btn" data-act="home">처음으로 (새로 등록)</button><button class="btn cta" data-act="png" id="pngbtn">⬇ 이미지(PNG)로 저장</button><span class="hint" id="pngname">${fileName(it)}</span></div></div>`;
}
function bind(){
  const v=$('#view');
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='pick')$('#fpick').click();
    if(a==='sample'){showSample=!showSample;render()}
    if(a==='bulk'){const t=$('#bulk').value.trim();if(t){slots.forEach(i=>{if(!i.cls.trim()&&(i.src||i.name.trim()))i.cls=t});render();}}
    if(a==='read')startRead();
    if(a==='stop')stopRead();
    if(a==='retry')retryOne(+b.dataset.i);
    if(a==='back'){setStep(1)}
    if(a==='report'){RI=items.map(it=>({...it,rows:(it.rows||[]).filter(validRow)})).filter(it=>it.rows.length);rep=0;setStep(3)}
    if(a==='edit')setStep(2);
    if(a==='png')savePng();
    if(a==='home'){stopRead();RI=[];slots=slots.map(s=>({id:s.id,name:'',cls:'',src:'',file:null,sample:false}));items=[];msg='';comments={};setStep(1)}
  });
  const fp=$('#fpick');if(fp)fp.onchange=e=>{fillFrom(e.target.files)};
  v.querySelectorAll('[data-slotfile]').forEach(f=>f.onchange=e=>fillFrom([...e.target.files].slice(0,1),+f.dataset.slotfile));
  v.querySelectorAll('.slot').forEach(c=>{const i=+c.dataset.slot;
    c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=e=>{e.preventDefault();c.classList.remove('over');fillFrom(e.dataTransfer.files,i)}});
  v.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const s=slots[+b.dataset.clear];s.src='';s.file=null;s.sample=false;render()});
  v.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{const it=slots.find(i=>i.id===+inp.dataset.id);it[inp.dataset.k]=inp.value;clearTimeout(window.__rt);window.__rt=setTimeout(()=>{const a=document.activeElement,id=a&&a.dataset&&a.dataset.id,k=a&&a.dataset&&a.dataset.k,p=a&&a.selectionStart;render();if(id){const n=document.querySelector(`input[data-id="${id}"][data-k="${k}"]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}},350)});
  v.querySelectorAll('input[data-r]').forEach(inp=>inp.oninput=()=>{const[i,r,k,s]=inp.dataset.r.split(':');const row=items[+i].rows[+r];
    if(k==='d'){const v=inp.value.trim(),ok=/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T00:00:00'));row.d=ok?v:'';row.cd=0;inp.parentElement.classList.toggle('chk',!ok);return}
    const val=parseFloat(inp.value);row[k][+s]=isNaN(val)?null:val;(k==='v'?row.cv:row.ca)[+s]=0;inp.parentElement.classList.remove('chk');});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const[i,r]=b.dataset.del.split(':');items[+i].rows.splice(+r,1);render()});
  v.querySelectorAll('[data-addrow]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.addrow];it.rows=it.rows||[];it.rows.push(blank());if(it.status!=='ok'&&it.status!=='run')it.status='ok';render()});
  v.querySelectorAll('[data-big]').forEach(b=>b.onclick=()=>{big[b.dataset.big]=!big[b.dataset.big];render()});
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{rep=+b.dataset.tab;render()});
  const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
  v.querySelectorAll('textarea.nv').forEach(fit);
  v.querySelectorAll('[data-nt]').forEach(t=>t.oninput=()=>{if(t.tagName==='TEXTAREA')fit(t);const[i,k]=t.dataset.nt.split(':');NOTICES[+i][k]=t.value;if(k==='l')t.style.width=nlW(t.value)+'em'});
}
document.addEventListener('paste',e=>{if(step!==1)return;const fs=[...(e.clipboardData?e.clipboardData.files:[])];if(fs.length){e.preventDefault();fillFrom(fs)}});
render();
</script>
