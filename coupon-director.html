<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정이조 주니어 | 원장님 - For Staff</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C2321; --ink-soft:#5B6360; --paper:#F6F7F9; --line:#E3E6E8;
    --gold:#C9971F; --gold-soft:#FBF2DE; --err:#C13E3E; --ok:#1F7A6C; --ok-soft:#E6F6EC;
  }
  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:var(--paper); color:var(--ink); margin:0; padding:0 0 60px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,4vw,48px); flex-wrap:wrap; gap:10px;
  }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .back-link, .logout-link{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    font-weight:700; font-size:13px; color:var(--ink-soft);
    padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .back-link:hover, .logout-link:hover{ background:var(--paper); color:var(--ink); }
  .who{ font-size:13.5px; font-weight:700; color:var(--ink-soft); }
  .who b{ color:var(--ink); }

  .wrap{ max-width:960px; margin:0 auto; padding:0 clamp(16px,4vw,32px); }
  .section{ margin-top:28px; }
  .section-title{ font-size:16px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  th, td{ padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); }
  th{ background:#FAFAFA; font-weight:700; color:var(--ink-soft); }
  tr:last-child td{ border-bottom:none; }
  .empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }

  .btn{ border:none; border-radius:8px; padding:7px 14px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .btn-ok{ background:var(--ok); color:#fff; }
  .btn-no{ background:var(--err); color:#fff; margin-left:6px; }
  .btn:disabled{ opacity:0.5; cursor:default; }

  .grant-form{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px;
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .grant-form .full{ grid-column:1 / -1; }
  label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; }
  select, input[type=text], input[type=number]{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit;
  }
  .grant-btn{
    grid-column:1 / -1; background:var(--gold); color:#fff; border:none; border-radius:8px;
    padding:11px; font-weight:800; font-size:13.5px; cursor:pointer; margin-top:4px;
  }
  .grant-btn:disabled{ opacity:0.5; }

  .msg{ font-size:12.5px; margin-top:10px; padding:8px 12px; border-radius:8px; display:none; }
  .msg.ok{ background:var(--ok-soft); color:var(--ok); display:block; }
  .msg.err{ background:#FDEDED; color:var(--err); display:block; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:800; }
  .badge.pending{ background:var(--gold-soft); color:var(--gold); }
  .badge.done{ background:var(--ok-soft); color:var(--ok); }
  .badge.rejected{ background:#FDEDED; color:var(--err); }

  .pwbox{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; max-width:360px;
  }

  .heart-toggle{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:#fff; border-radius:20px;
    padding:8px 14px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .heart-toggle.active{ background:#FDEEF0; border-color:#F3B9C2; color:#C13E63; }
  .field-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .expiry-note{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" href="index.html#home">← 처음으로</a>
    <span class="who">👋 <b id="whoName">-</b> 원장님 <span id="campusLabel" style="color:var(--ink-soft);font-weight:600;"></span></span>
  </div>
  <span class="logout-link" id="logoutBtn">로그아웃</span>
</div>

<div class="wrap">

  <div class="section">
    <div class="section-title">➕ 지급 / 회수</div>
    <div class="grant-form">
      <div>
        <label>선생님</label>
        <select id="grantStaff"></select>
      </div>
      <div>
        <label>종류</label>
        <select id="grantType">
          <option value="LTE">LTE</option>
          <option value="Wow">Wow</option>
        </select>
      </div>
      <div>
        <label>개수 (지급은 양수, 회수는 음수)</label>
        <input type="number" id="grantDelta" value="1">
      </div>
      <div>
        <label>사유 (선택)</label>
        <input type="text" id="grantReason" placeholder="예: 이번 달 정기 지급">
      </div>
      <div class="full">
        <button type="button" class="heart-toggle" id="unlimitedToggle" aria-pressed="false">🤍 무제한 쿠폰 (만료 없음)</button>
        <div class="field-hint">지급 시 이 버튼을 누르면 만료일 없이 지급돼요. 다시 누르면 취소돼요. (회수에는 적용 안 됨)</div>
      </div>
      <button class="grant-btn" id="grantBtn">처리하기</button>
      <div class="msg full" id="grantMsg"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 전체 내역</div>
    <table>
      <thead><tr><th>일시</th><th>아이디</th><th>이름</th><th>종류</th><th>구분</th><th>증감</th><th>만료일</th><th>사유</th><th>상태</th><th>처리자</th></tr></thead>
      <tbody id="historyBody"><tr><td colspan="10" class="empty">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">🎟️ 선생님별 잔여 현황</div>
    <table>
      <thead><tr><th>아이디</th><th>이름</th><th>LTE 잔여</th><th>WOW 잔여</th></tr></thead>
      <tbody id="balanceBody"><tr><td colspan="4" class="empty">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">🔒 비밀번호 변경</div>
    <div class="pwbox">
      <label>새 비밀번호</label>
      <input type="text" id="newPw" placeholder="새 비밀번호 입력" style="margin-bottom:10px;">
      <button class="grant-btn" id="pwBtn" style="margin-top:0;">비밀번호 변경</button>
      <div class="msg" id="pwMsg"></div>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://nqrtnxpqxtglwhdvtsxf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Yxuoe98BlUlZRidr1QsA-A_AS3-UwRW";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const staffId = sessionStorage.getItem('staff_id');
  const staffName = sessionStorage.getItem('staff_name');
  const staffRole = sessionStorage.getItem('staff_role');
  const staffCampus = sessionStorage.getItem('staff_campus');

  if(!staffId || staffRole !== 'director'){
    window.location.href = 'coupon-hub.html';
  }
  document.getElementById('whoName').textContent = staffName || staffId;
  const CAMPUS_NAMES = { dj: '동작', m2: '목동2관' };
  document.getElementById('campusLabel').textContent = '(' + (CAMPUS_NAMES[staffCampus] || staffCampus) + ')';

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    sessionStorage.clear();
    window.location.href = 'coupon-hub.html';
  };

  let balancesCache = [];
  let isUnlimited = false;

  const unlimitedBtn = document.getElementById('unlimitedToggle');
  unlimitedBtn.onclick = () => {
    isUnlimited = !isUnlimited;
    unlimitedBtn.textContent = isUnlimited ? '❤️ 무제한 쿠폰 (만료 없음)' : '🤍 무제한 쿠폰 (만료 없음)';
    unlimitedBtn.classList.toggle('active', isUnlimited);
    unlimitedBtn.setAttribute('aria-pressed', String(isUnlimited));
  };

  function balanceCell(qty, expiry, unlimited){
    let html = `<b>${qty}</b>개`;
    if(unlimited) html += ' <span title="무제한 포함" style="color:var(--gold);">♾️</span>';
    if(expiry) html += `<div class="expiry-note">~${expiry} 만료</div>`;
    return html;
  }

  // 원장님 본인은 쿠폰 대상이 아니므로 목록에서 제외 (어느 캠퍼스든 로그인한 본인 아이디 기준)

  async function loadBalances(){
    const res = await fetch('/api/coupon?action=balances&campus=' + encodeURIComponent(staffCampus));
    const data = await res.json();

    if(data.error){
      document.getElementById('balanceBody').innerHTML =
        `<tr><td colspan="4" class="empty" style="color:var(--err);">에러: ${data.error}</td></tr>`;
      return;
    }

    balancesCache = (data.rows || []).filter(r => r.id !== staffId);

    const body = document.getElementById('balanceBody');
    if(balancesCache.length === 0){
      body.innerHTML = '<tr><td colspan="4" class="empty">데이터 없음</td></tr>';
    } else {
      body.innerHTML = balancesCache.map(r =>
        `<tr><td>${r.id}</td><td>${r.name}</td>
          <td>${balanceCell(r.lte, r.lteExpiry, r.lteUnlimited)}</td>
          <td>${balanceCell(r.wow, r.wowExpiry, r.wowUnlimited)}</td>
        </tr>`
      ).join('');
    }

    const staffSelect = document.getElementById('grantStaff');
    staffSelect.innerHTML = balancesCache.map(r => `<option value="${r.id}|${r.name}">${r.name} (${r.id})</option>`).join('');
  }

  function statusBadge(status){
    if(status === '대기') return '<span class="badge pending">대기</span>';
    if(status === '완료') return '<span class="badge done">완료</span>';
    if(status === '거절') return '<span class="badge rejected">거절</span>';
    return status;
  }

  function expiryCell(r){
    if(r.category !== '지급') return '-';
    if(r.unlimited === 'Y') return '♾️ 무제한';
    return r.expiry || '-';
  }

  async function loadHistory(){
    const res = await fetch('/api/coupon?action=history&campus=' + encodeURIComponent(staffCampus));
    const data = await res.json();

    if(data.error){
      document.getElementById('historyBody').innerHTML =
        `<tr><td colspan="10" class="empty" style="color:var(--err);">에러: ${data.error}</td></tr>`;
      return;
    }

    const rows = data.rows || [];

    const historyBody = document.getElementById('historyBody');
    if(rows.length === 0){
      historyBody.innerHTML = '<tr><td colspan="10" class="empty">데이터 없음</td></tr>';
    } else {
      historyBody.innerHTML = rows.slice().reverse().map(r => `
        <tr>
          <td>${r.date ? new Date(r.date).toLocaleString('ko-KR') : ''}</td>
          <td>${r.id}</td><td>${r.name}</td><td>${r.type}</td><td>${r.category}</td>
          <td>${r.delta}</td><td>${expiryCell(r)}</td><td>${r.reason || '-'}</td>
          <td>${statusBadge(r.status)}</td><td>${r.handler || '-'}</td>
        </tr>
      `).join('');
    }
  }

  async function refreshAll(){
    await Promise.all([loadBalances(), loadHistory()]);
  }

  document.getElementById('grantBtn').onclick = async () => {
    const btn = document.getElementById('grantBtn');
    const msg = document.getElementById('grantMsg');
    msg.className = 'msg full';

    const [id, name] = document.getElementById('grantStaff').value.split('|');
    const type = document.getElementById('grantType').value;
    const delta = Number(document.getElementById('grantDelta').value);
    const reason = document.getElementById('grantReason').value;

    if(!id || !delta){
      msg.className = 'msg full err';
      msg.textContent = '선생님과 개수를 확인해주세요.';
      return;
    }

    const verb = delta > 0 ? '지급' : '회수';
    const unlimitedNote = (delta > 0 && isUnlimited) ? ' (무제한, 만료 없음)' : '';
    const confirmed = confirm(`${name} 선생님에게 ${type} ${Math.abs(delta)}개를 ${verb}하시겠습니까?${unlimitedNote}`);
    if(!confirmed) return;

    btn.disabled = true;
    btn.textContent = '처리 중...';

    try{
      const res = await fetch('/api/coupon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'grant', id, name, type, delta, reason, handler: staffName, campus: staffCampus, unlimited: delta > 0 && isUnlimited }),
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      msg.className = 'msg full ok';
      msg.textContent = '처리됐어요!';
      document.getElementById('grantReason').value = '';
      isUnlimited = false;
      unlimitedBtn.textContent = '🤍 무제한 쿠폰 (만료 없음)';
      unlimitedBtn.classList.remove('active');
      unlimitedBtn.setAttribute('aria-pressed', 'false');
      await refreshAll();
    }catch(e){
      msg.className = 'msg full err';
      msg.textContent = '오류: ' + e.message;
    }

    btn.disabled = false;
    btn.textContent = '처리하기';
  };

  document.getElementById('pwBtn').onclick = async () => {
    const newPw = document.getElementById('newPw').value;
    const msg = document.getElementById('pwMsg');
    if(!newPw || newPw.length < 4){
      msg.className = 'msg err';
      msg.textContent = '비밀번호는 4자 이상으로 입력해주세요.';
      return;
    }
    const { error } = await sb.auth.updateUser({ password: newPw });
    if(error){
      msg.className = 'msg err';
      msg.textContent = '변경 실패: ' + error.message;
    } else {
      msg.className = 'msg ok';
      msg.textContent = '비밀번호가 변경됐어요!';
      document.getElementById('newPw').value = '';
    }
  };

  refreshAll();
  setInterval(refreshAll, 10000); // 10초마다 자동 갱신
</script>

</body>
</html>
