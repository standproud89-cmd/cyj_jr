<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정이조 주니어 | 선생님 - For Staff</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C2321; --ink-soft:#5B6360; --paper:#F6F7F9; --line:#E3E6E8;
    --gold:#C9971F; --gold-soft:#FBF2DE; --err:#C13E3E; --ok:#1F7A6C; --ok-soft:#E6F6EC;
  }
  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:var(--paper); color:var(--ink); margin:0; padding:0 0 60px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,4vw,48px); flex-wrap:wrap; gap:10px;
  }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .back-link, .logout-link{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    font-weight:700; font-size:13px; color:var(--ink-soft);
    padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .back-link:hover, .logout-link:hover{ background:var(--paper); color:var(--ink); }
  .who{ font-size:13.5px; font-weight:700; color:var(--ink-soft); }
  .who b{ color:var(--ink); }

  .wrap{ max-width:640px; margin:0 auto; padding:0 clamp(16px,4vw,32px); }

  .balance-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px; }
  .balance-card{
    background:#fff; border:1px solid var(--line); border-radius:20px; padding:26px 20px; text-align:center;
  }
  .balance-card .label{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .balance-card .num{ font-size:40px; font-weight:800; color:var(--gold); }
  .balance-card .unit{ font-size:13px; color:var(--ink-soft); margin-left:4px; }

  .section{ margin-top:32px; }
  .section-title{ font-size:16px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

  .request-form{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px;
  }
  label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; }
  select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  .field{ margin-bottom:14px; }
  .req-btn{
    width:100%; background:var(--gold); color:#fff; border:none; border-radius:10px;
    padding:12px; font-weight:800; font-size:14px; cursor:pointer;
  }
  .req-btn:disabled{ opacity:0.5; }

  .msg{ font-size:12.5px; margin-top:10px; padding:8px 12px; border-radius:8px; display:none; }
  .msg.ok{ background:var(--ok-soft); color:var(--ok); display:block; }
  .msg.err{ background:#FDEDED; color:var(--err); display:block; }

  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  th, td{ padding:10px 12px; text-align:left; font-size:12.5px; border-bottom:1px solid var(--line); }
  th{ background:#FAFAFA; font-weight:700; color:var(--ink-soft); }
  tr:last-child td{ border-bottom:none; }
  .empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:800; }
  .badge.pending{ background:var(--gold-soft); color:var(--gold); }
  .badge.done{ background:var(--ok-soft); color:var(--ok); }
  .badge.rejected{ background:#FDEDED; color:var(--err); }

  .pwbox{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" href="index.html#home">← 처음으로</a>
    <span class="who">👋 <b id="whoName">-</b> 선생님</span>
  </div>
  <span class="logout-link" id="logoutBtn">로그아웃</span>
</div>

<div class="wrap">

  <div class="balance-grid">
    <div class="balance-card">
      <div class="label">LTE 잔여</div>
      <div><span class="num" id="lteNum">-</span><span class="unit">개</span></div>
    </div>
    <div class="balance-card">
      <div class="label">Wow 잔여</div>
      <div><span class="num" id="wowNum">-</span><span class="unit">개</span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">✏️ 사용신청</div>
    <div class="request-form">
      <div class="field">
        <label>종류</label>
        <select id="reqType">
          <option value="LTE">LTE</option>
          <option value="Wow">Wow</option>
        </select>
      </div>
      <div class="field">
        <label>사용 사유 (간단히)</label>
        <textarea id="reqReason" placeholder="예: 다음 주 화요일 점심시간 연장 사용하겠습니다"></textarea>
      </div>
      <button class="req-btn" id="reqBtn">신청하기</button>
      <div class="msg" id="reqMsg"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 내 신청/사용 내역</div>
    <table>
      <thead><tr><th>일시</th><th>종류</th><th>사유</th><th>상태</th></tr></thead>
      <tbody id="historyBody"><tr><td colspan="4" class="empty">불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">🔒 비밀번호 변경</div>
    <div class="pwbox">
      <label>새 비밀번호</label>
      <input type="text" id="newPw" placeholder="새 비밀번호 입력" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:10px;">
      <button class="req-btn" id="pwBtn">비밀번호 변경</button>
      <div class="msg" id="pwMsg"></div>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://nqrtnxpqxtglwhdvtsxf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Yxuoe98BlUlZRidr1QsA-A_AS3-UwRW";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const staffId = sessionStorage.getItem('staff_id');
  const staffName = sessionStorage.getItem('staff_name');
  const staffRole = sessionStorage.getItem('staff_role');

  if(!staffId || staffRole !== 'teacher'){
    window.location.href = 'coupon-hub.html';
  }
  document.getElementById('whoName').textContent = staffName || staffId;

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    sessionStorage.clear();
    window.location.href = 'coupon-hub.html';
  };

  function statusBadge(status){
    if(status === '대기') return '<span class="badge pending">대기</span>';
    if(status === '완료') return '<span class="badge done">완료</span>';
    if(status === '거절') return '<span class="badge rejected">거절</span>';
    return status;
  }

  async function loadBalance(){
    const res = await fetch('/api/coupon?action=balances');
    const data = await res.json();
    const mine = (data.rows || []).find(r => r.id === staffId);
    document.getElementById('lteNum').textContent = mine ? mine.lte : 0;
    document.getElementById('wowNum').textContent = mine ? mine.wow : 0;
  }

  async function loadHistory(){
    const res = await fetch('/api/coupon?action=history');
    const data = await res.json();
    const mine = (data.rows || []).filter(r => r.id === staffId && r.category !== '지급' && r.category !== '회수');

    const body = document.getElementById('historyBody');
    if(mine.length === 0){
      body.innerHTML = '<tr><td colspan="4" class="empty">아직 신청 내역이 없어요</td></tr>';
    } else {
      body.innerHTML = mine.slice().reverse().map(r => `
        <tr>
          <td>${r.date ? new Date(r.date).toLocaleString('ko-KR') : ''}</td>
          <td>${r.type}</td>
          <td>${r.reason || '-'}</td>
          <td>${statusBadge(r.status)}</td>
        </tr>
      `).join('');
    }
  }

  async function refreshAll(){
    await Promise.all([loadBalance(), loadHistory()]);
  }

  document.getElementById('reqBtn').onclick = async () => {
    const btn = document.getElementById('reqBtn');
    const msg = document.getElementById('reqMsg');
    const type = document.getElementById('reqType').value;
    const reason = document.getElementById('reqReason').value.trim();

    if(!reason){
      msg.className = 'msg err';
      msg.textContent = '사용 사유를 입력해주세요.';
      return;
    }

    btn.disabled = true;
    btn.textContent = '신청 중...';

    try{
      const res = await fetch('/api/coupon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'request', id: staffId, name: staffName, type, reason }),
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      msg.className = 'msg ok';
      msg.textContent = '신청됐어요! 원장님 승인을 기다려주세요.';
      document.getElementById('reqReason').value = '';
      await refreshAll();
    }catch(e){
      msg.className = 'msg err';
      msg.textContent = '오류: ' + e.message;
    }

    btn.disabled = false;
    btn.textContent = '신청하기';
  };

  document.getElementById('pwBtn').onclick = async () => {
    const newPw = document.getElementById('newPw').value;
    const msg = document.getElementById('pwMsg');
    if(!newPw || newPw.length < 4){
      msg.className = 'msg err';
      msg.textContent = '비밀번호는 4자 이상으로 입력해주세요.';
      return;
    }
    const { error } = await sb.auth.updateUser({ password: newPw });
    if(error){
      msg.className = 'msg err';
      msg.textContent = '변경 실패: ' + error.message;
    } else {
      msg.className = 'msg ok';
      msg.textContent = '비밀번호가 변경됐어요!';
      document.getElementById('newPw').value = '';
    }
  };

  refreshAll();
</script>

</body>
</html>
